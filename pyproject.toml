[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "operamind-vnext"
version = "0.1.0.dev0"
description = "Web-first evidence-bound change delivery with VS Code GitHub Copilot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "jsonschema>=4.23,<5",
  "openpyxl>=3.1,<4",
  "pathspec>=0.12,<2",
  "playwright==1.61.0",
  "psycopg[binary]>=3.2,<4",
  "python-docx>=1.1,<2",
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-java>=0.23.5,<0.24",
  "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-kotlin>=1.1,<2",
  "tree-sitter-python>=0.25,<0.26",
  "tree-sitter-typescript>=0.23.2,<0.24",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
  "types-jsonschema>=4.23,<5",
  "types-openpyxl>=3.1,<4",
]

[project.scripts]
operamind-baseline = "operamind.commands.baseline:main"
operamind-build-code-graph = "operamind.commands.build_code_graph:main"
operamind-runtime-routes = "operamind.commands.runtime_routes:main"
operamind-unresolved-evidence = "operamind.commands.unresolved_evidence:main"
operamind-profile-rebuild-worker = "operamind.commands.profile_rebuild_worker:main"
operamind-build-context = "operamind.commands.build_context:main"
operamind-build-index = "operamind.commands.build_index:main"
operamind-recover-index = "operamind.commands.recover_index:main"
operamind-build-relations = "operamind.commands.build_relations:main"
operamind-diff = "operamind.commands.diff:main"
operamind-evaluate-rag = "operamind.commands.evaluate_rag:main"
operamind-run-golden-rag = "operamind.commands.run_golden_rag:main"
operamind-finalize-rag = "operamind.commands.finalize_rag:main"
operamind-ingest = "operamind.commands.ingest:main"
operamind-migrate = "operamind.commands.migrate:main"
operamind-mcp = "operamind.commands.mcp_server:main"
operamind-profile = "operamind.commands.profile:main"
operamind-recover-command = "operamind.commands.recover_command:main"
operamind-readiness = "operamind.commands.readiness:main"
operamind-web = "operamind.commands.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires an explicitly configured external dependency",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["operamind"]
