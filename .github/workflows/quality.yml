name: Quality baseline

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18-bookworm
        env:
          POSTGRES_DB: operamind_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d operamind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPERAMIND_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/operamind_test
      PYTHONPYCACHEPREFIX: /tmp/operamind-pycache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Static checks
        run: |
          ruff check .
          mypy
      - name: Regression coverage
        run: |
          mkdir -p quality-results
          pytest -q \
            --ignore=tests/integration/test_live_embedding_provider.py \
            --ignore=tests/integration/test_golden_screen_change.py \
            --junitxml=quality-results/python.xml \
            --cov=operamind \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            --cov-fail-under=80
      - name: Critical capability coverage
        if: always()
        run: python scripts/check_critical_coverage.py
      - name: Write quality summary
        if: always()
        run: >-
          python scripts/write_quality_summary.py
          --junit "Python=quality-results/python.xml"
          --coverage-json coverage.json
          --output "$GITHUB_STEP_SUMMARY"
          --allow-missing
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-results-ubuntu
          path: |
            coverage.json
            quality-results/
          if-no-files-found: warn

  windows-compatibility:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Windows Python regression
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force quality-results | Out-Null
          python -m pytest -q `
            --junitxml=quality-results/windows-python.xml `
            tests/application/test_environment_file.py `
            tests/application/test_launcher.py `
            tests/application/test_local_installation.py `
            tests/application/test_platform_runtime.py `
            tests/application/test_copilot_document_uri.py `
            tests/application/test_project_stack.py `
            tests/application/test_command_execution_runner.py `
            tests/infrastructure/test_orchestration_worker.py
      - name: VS Code Extension regression
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force quality-results | Out-Null
          npm ci --prefix vscode-extension
          npm run test:junit --prefix vscode-extension
      - name: Write Windows quality summary
        if: always()
        shell: pwsh
        run: |
          python scripts/write_quality_summary.py `
            --junit "Windows Python=quality-results/windows-python.xml" `
            --junit "VS Code Extension=quality-results/vscode-extension.xml" `
            --output "$env:GITHUB_STEP_SUMMARY" `
            --allow-missing
      - name: Upload Windows quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-results-windows
          path: quality-results/
          if-no-files-found: warn
