name: Quality baseline

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18-bookworm
        env:
          POSTGRES_DB: operamind_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d operamind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPERAMIND_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/operamind_test
      PYTHONPYCACHEPREFIX: /tmp/operamind-pycache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Static checks
        run: |
          ruff check .
          mypy
      - name: Regression coverage
        run: >-
          pytest -q
          --ignore=tests/integration/test_live_embedding_provider.py
          --ignore=tests/integration/test_golden_screen_change.py
          --cov=operamind
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-fail-under=80
      - name: Critical capability coverage
        run: python scripts/check_critical_coverage.py
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: coverage.json
          if-no-files-found: error
