<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">OperaMind の六工程変更閉ループ</title>
  <desc id="desc">利用者の変更要件から設計書差分、コード範囲、コード変更とテスト、データ生成後の UI 検証、最終レポートまでを示す</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8f6"/>
      <stop offset="1" stop-color="#e8f0ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#16352c" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#58766d"/>
    </marker>
    <style>
      text { font-family: "Noto Sans JP", "Yu Gothic", sans-serif; fill: #17342b; }
      .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 0.14em; fill: #287561; }
      .title { font-size: 36px; font-weight: 800; }
      .subtitle { font-size: 17px; fill: #526a62; }
      .number { font-size: 15px; font-weight: 800; fill: #fff; }
      .stage-title { font-size: 20px; font-weight: 800; }
      .stage-owner { font-size: 14px; font-weight: 700; fill: #527067; }
      .lane-title { font-size: 18px; font-weight: 800; }
      .lane-text { font-size: 15px; fill: #506961; }
      .note { font-size: 14px; fill: #587169; }
      .arrow { stroke: #58766d; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="720" rx="28" fill="url(#background)"/>
  <circle cx="1450" cy="20" r="260" fill="#68b7a1" opacity="0.10"/>
  <circle cx="80" cy="740" r="230" fill="#6d8fec" opacity="0.08"/>

  <text x="72" y="66" class="eyebrow">OPERAMIND vNEXT</text>
  <text x="72" y="112" class="title">一つの Change Task、六つの見える工程</text>
  <text x="72" y="145" class="subtitle">編集 AI: VS Code GitHub Copilot ／ 内部制御: 自動・非表示</text>

  <g filter="url(#shadow)">
    <g transform="translate(72 205)">
      <rect width="220" height="138" rx="20" fill="#ffffff" stroke="#b8d3ca"/>
      <circle cx="30" cy="30" r="18" fill="#287561"/>
      <text x="30" y="35" text-anchor="middle" class="number">1</text>
      <text x="24" y="78" class="stage-title">変更要件</text>
      <text x="24" y="108" class="stage-owner">利用者 / Web</text>
    </g>
    <g transform="translate(320 205)">
      <rect width="220" height="138" rx="20" fill="#eef8f5" stroke="#7fc1ae"/>
      <circle cx="30" cy="30" r="18" fill="#287561"/>
      <text x="30" y="35" text-anchor="middle" class="number">2</text>
      <text x="24" y="78" class="stage-title">設計書差分</text>
      <text x="24" y="108" class="stage-owner">RAG + Copilot</text>
    </g>
    <g transform="translate(568 205)">
      <rect width="220" height="138" rx="20" fill="#eef4ff" stroke="#8ba8de"/>
      <circle cx="30" cy="30" r="18" fill="#526fb5"/>
      <text x="30" y="35" text-anchor="middle" class="number">3</text>
      <text x="24" y="78" class="stage-title">コード範囲</text>
      <text x="24" y="108" class="stage-owner">Code Graph</text>
    </g>
    <g transform="translate(816 205)">
      <rect width="220" height="138" rx="20" fill="#f2efff" stroke="#9e90dd"/>
      <circle cx="30" cy="30" r="18" fill="#755fc2"/>
      <text x="30" y="35" text-anchor="middle" class="number">4</text>
      <text x="24" y="78" class="stage-title">変更・テスト</text>
      <text x="24" y="108" class="stage-owner">Copilot + MCP</text>
    </g>
    <g transform="translate(1064 205)">
      <rect width="220" height="138" rx="20" fill="#fff6e8" stroke="#d9aa62"/>
      <circle cx="30" cy="30" r="18" fill="#b47724"/>
      <text x="30" y="35" text-anchor="middle" class="number">5</text>
      <text x="24" y="78" class="stage-title">データ・UI</text>
      <text x="24" y="108" class="stage-owner">TestData → UI</text>
    </g>
    <g transform="translate(1312 205)">
      <rect width="220" height="138" rx="20" fill="#fff0f1" stroke="#d7979d"/>
      <circle cx="30" cy="30" r="18" fill="#ae525d"/>
      <text x="30" y="35" text-anchor="middle" class="number">6</text>
      <text x="24" y="78" class="stage-title">最終レポート</text>
      <text x="24" y="108" class="stage-owner">Evidence / Closure</text>
    </g>
  </g>

  <path d="M292 274H312" class="arrow"/>
  <path d="M540 274H560" class="arrow"/>
  <path d="M788 274H808" class="arrow"/>
  <path d="M1036 274H1056" class="arrow"/>
  <path d="M1284 274H1304" class="arrow"/>

  <g transform="translate(72 405)">
    <rect width="460" height="204" rx="22" fill="#ffffff" stroke="#bfd4cd"/>
    <text x="28" y="40" class="lane-title">Web — 入力と結果だけ</text>
    <text x="28" y="78" class="lane-text">• 変更要件を登録</text>
    <text x="28" y="108" class="lane-text">• 六工程の差分、範囲、結果、阻断理由を表示</text>
    <text x="28" y="138" class="lane-text">• Screenshot と最終 Report を表示</text>
    <text x="28" y="178" class="note">Approval / Worker / Queue の操作画面は持たない</text>
  </g>

  <g transform="translate(570 405)">
    <rect width="460" height="204" rx="22" fill="#f4f1ff" stroke="#b2a6e2"/>
    <text x="28" y="40" class="lane-title">VS Code GitHub Copilot — 一つの会話</text>
    <text x="28" y="78" class="lane-text">• document_change: RAG 対象設計書を変更</text>
    <text x="28" y="108" class="lane-text">• code_scope: 読み取り専用 Scope を提示</text>
    <text x="28" y="138" class="lane-text">• Diff 検証後に Code / TestPlan を完成</text>
    <text x="28" y="178" class="note">任意 Shell と Packet 外ファイルは拒否</text>
  </g>

  <g transform="translate(1068 405)">
    <rect width="464" height="204" rx="22" fill="#edf8f4" stroke="#8bc5b3"/>
    <text x="28" y="40" class="lane-title">OperaMind — 検証と自動実行</text>
    <text x="28" y="78" class="lane-text">• Canonical RAG / Code Graph / Git Diff を検証</text>
    <text x="28" y="108" class="lane-text">• TestDataPlan でデータ生成後に UI を実行</text>
    <text x="28" y="138" class="lane-text">• Coverage / Screenshot / Closure を結合</text>
    <text x="28" y="178" class="note">欠落・drift・範囲外は fail closed</text>
  </g>

  <text x="800" y="674" text-anchor="middle" class="note">Canonical PostgreSQL + immutable Artifact / Local Bridge + MCP / local Embedding</text>
</svg>
